name: Generate War in the World 3D prototypes

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generate_soldier_batch.py"
      - "tools/generate_weapon_prop_batch.py"
      - "tools/generate_vehicle_batch.py"
      - "tools/generate_environment_batch.py"
      - ".github/workflows/generate-soldiers.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Generate soldier prototypes
        run: blender --background --python tools/generate_soldier_batch.py
      - name: Generate weapons and combat props
        run: blender --background --python tools/generate_weapon_prop_batch.py
      - name: Generate vehicle prototypes
        run: blender --background --python tools/generate_vehicle_batch.py
      - name: Generate environment prototypes
        run: blender --background --python tools/generate_environment_batch.py
      - name: Commit generated GLB files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -n "$(find public/assets/models -type f -name '*.glb' -print -quit)" || { echo "No GLB files were generated"; exit 1; }
          git add -f public/assets/models/
          if git diff --cached --quiet; then
            echo "Generated GLB files already match the repository."
          else
            git commit -m "Generate first military 3D prototype asset batches"
            git push
          fi
